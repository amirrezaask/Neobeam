[package]
name = "app"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nvim-ui"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.102"
arboard = "3.6.1"
directories = "6.0.0"
editor-surface = { version = "0.1.0", path = "../editor-surface" }
flume = "0.12.0"
nvim-core = { version = "0.1.0", path = "../nvim-core" }
nvim-rs = { version = "0.9.2", features = ["use_tokio"] }
pollster = "0.4.0"
rmpv = "1.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "process", "io-util", "sync", "time"] }
tokio-util = { version = "0.7.18", features = ["compat"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
wgpu = "29.0.3"
winit = "0.30.13"
